name: Release

on:
  workflow_run:
    workflows: ["Coverage & Deploy Report"]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODEVERSION: "20.x"

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    name: Build & Publish
    # Only publish when CI succeeded on a push event to master
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODEVERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack & activate Yarn v4
        run: |
          corepack enable
          corepack prepare yarn@4.17.0 --activate
        shell: bash

      - name: Get Yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint, Build & Test with Coverage
        run: yarn build:test

      - name: Extract version from git tag
        id: version
        run: |
          TAG=$(git tag --points-at HEAD | grep '^v' | sort -V | tail -1)
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          VERSION=${TAG#v}
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "package_name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "📦 Package: ${PACKAGE_NAME}"
          echo "📦 Version to publish: ${VERSION}"

      - name: Update package.json version
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - name: Verify OIDC authentication
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL}" ]; then
            echo "✅ Using OIDC trusted publishing"
          else
            echo "❌ No authentication method found."
            echo ""
            echo "To configure OIDC trusted publishing:"
            echo "  1. Go to https://www.npmjs.com/package/aided-core/settings"
            echo "  2. Add a trusted publisher for this repository and workflow"
            echo "  3. Ensure 'id-token: write' is in your workflow permissions"
            exit 1
          fi

      - name: Publish to NPM
        run: npm publish --workspace=packages/core --provenance --access public

      - name: Set step outputs
        id: outputs
        run: |
          echo "package-name=${{ steps.version.outputs.package_name }}" >> "$GITHUB_OUTPUT"
          echo "version=${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "npm-url=https://www.npmjs.com/package/${{ steps.version.outputs.package_name }}" >> "$GITHUB_OUTPUT"

      - name: Resolve tag name
        id: tag
        run: |
          TAG=$(git tag --points-at HEAD | grep '^v' | sort -V | tail -1)
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "Changes since $PREV_TAG:" > changelog.md
            echo "" >> changelog.md
            git log "$PREV_TAG..$TAG" --pretty=format:"- %s (%h)" >> changelog.md
          else
            echo "Initial release." > changelog.md
          fi
          echo "" >> changelog.md
          echo "Full changelog: https://github.com/${{ github.repository }}/commits/$TAG" >> changelog.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            packages/*/dist
            packages/*/package.json
          if-no-files-found: error
          retention-days: 5

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Release ${{ steps.tag.outputs.name }}
          body_path: changelog.md
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
          files: |
            packages/*/dist/**
            packages/*/package.json
