<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>[FEATURE_NAME] Tests - Aided Test Suite</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }
    .test-header {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      margin-bottom: 20px;
    }
    .test-header h1 {
      margin: 0 0 10px 0;
      color: #333;
    }
    .test-header p {
      margin: 0;
      color: #666;
    }
    #test-container {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
    }
    #test-results {
      font-family: 'Courier New', monospace;
      white-space: pre-wrap;
      word-wrap: break-word;
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 15px;
      margin-top: 20px;
    }
    #test-results h2 {
      margin-top: 0;
      color: #333;
    }
    #test-results pre {
      margin: 0;
      color: #666;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 10px;
    }
    .badge-security {
      background: #fee;
      color: #c33;
    }
    .badge-performance {
      background: #e3f2fd;
      color: #1976d2;
    }
    .badge-functionality {
      background: #e8f5e9;
      color: #388e3c;
    }
  </style>
</head>
<body>
  <div class="test-header">
    <h1>[FEATURE_NAME] Tests <span class="badge badge-[TYPE]">[TYPE]</span></h1>
    <p>[DESCRIPTION] (Requirements [REQ_IDS])</p>
  </div>
  <div id="test-container"></div>
  <script type="module" src="./tests.ts"></script>
</body>
</html>
