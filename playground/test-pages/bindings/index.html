<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bindings Comprehensive Test Suite</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 30px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      background: #007bff;
      color: white;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s;
    }

    button:hover {
      background: #0056b3;
    }

    button:active {
      transform: scale(0.98);
    }

    .results {
      margin-top: 30px;
    }

    .test-group {
      margin-bottom: 25px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
    }

    .test-group-header {
      background: #f8f9fa;
      padding: 15px;
      border-bottom: 1px solid #e0e0e0;
      font-weight: 600;
      color: #333;
      cursor: pointer;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .test-group-header:hover {
      background: #e9ecef;
    }

    .test-group-count {
      font-size: 12px;
      color: #666;
      font-weight: normal;
    }

    .test-items {
      padding: 15px;
    }

    .test-item {
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 4px;
      border-left: 4px solid #ddd;
      background: #fafafa;
      font-size: 13px;
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
    }

    .test-item.pass {
      border-left-color: #28a745;
      background: #f0f9f6;
    }

    .test-item.fail {
      border-left-color: #dc3545;
      background: #fdf5f5;
    }

    .test-item.pending {
      border-left-color: #ffc107;
      background: #fffbf0;
    }

    .test-name {
      font-weight: 600;
      color: #333;
      margin-bottom: 5px;
    }

    .test-status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 600;
      margin-right: 8px;
    }

    .test-status.pass {
      background: #28a745;
      color: white;
    }

    .test-status.fail {
      background: #dc3545;
      color: white;
    }

    .test-status.pending {
      background: #ffc107;
      color: #333;
    }

    .test-details {
      margin-top: 8px;
      padding: 8px;
      background: rgba(0, 0, 0, 0.03);
      border-radius: 3px;
      font-size: 12px;
      color: #555;
      max-height: 200px;
      overflow-y: auto;
    }

    .summary {
      margin-top: 30px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 4px;
      border: 1px solid #e0e0e0;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .summary-row:last-child {
      border-bottom: none;
    }

    .summary-label {
      font-weight: 600;
      color: #333;
    }

    .summary-value {
      color: #666;
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
    }

    .summary-value.pass {
      color: #28a745;
      font-weight: 600;
    }

    .summary-value.fail {
      color: #dc3545;
      font-weight: 600;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #007bff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 10px;
      vertical-align: middle;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Bindings Comprehensive Test Suite</h1>
    <p class="subtitle">Testing all binding utilities in packages/core/src/dom/bindings.ts</p>

    <div class="controls">
      <button onclick="runAllTests()">Run All Tests</button>
      <button onclick="clearResults()">Clear Results</button>
    </div>

    <div id="results" class="results"></div>
    <div id="summary" class="summary" style="display: none;"></div>
  </div>

  <script type="module" src="./tests.ts"></script>
</body>

</html>
